<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Extended Euclid · gcd(168, 133)</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#202e30;font:16px/1.5 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:clamp(16px,4vw,52px)}h1,h2,p{margin:0}h1{font:clamp(32px,5vw,54px)/1.12 Georgia,serif;letter-spacing:-.04em;margin:6px 0 10px}.label,th{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#51625f}.card{background:white;border:1px solid #d3d9d2;border-radius:14px;margin-top:20px;overflow:hidden}.panel{padding:clamp(16px,3vw,32px)}.header,nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.formula,td{font-family:Georgia,serif}.formula{display:flex;align-items:baseline;gap:.17em;flex-wrap:wrap;font-size:clamp(25px,4vw,44px);min-height:2.3em;padding:.42em 0}.term{display:inline-block;white-space:nowrap}.a{color:#086b60}.b{color:#814c83}.sub{background:#edf4ee;padding:13px 18px;border-left:3px solid #30796a;min-height:72px}.sub strong{display:block}nav{justify-content:flex-start;margin-top:16px}button,select{font:inherit;border-radius:7px;border:1px solid #bac7c0;padding:7px 12px;background:white;color:inherit;cursor:pointer}button:disabled{opacity:.4}#play{background:#1e5148;color:white;min-width:85px}label{margin-left:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px clamp(8px,2vw,22px);border-top:1px solid #dee2db}th{background:#f6f8f4}td{font-size:clamp(17px,2.25vw,24px)}.card h2{font-size:18px;padding:14px 20px}.source{background:#e5f2e8}.floating-term{position:fixed;z-index:10;pointer-events:none;font:24px Georgia,serif;background:#f5fff4;color:#174c41;padding:3px 8px;border:1px solid #76a898;border-radius:5px}.work{margin:12px 0 0;padding-left:2em;line-height:1.65;font:19px/1.6 Georgia,serif}details{margin-top:15px}summary{cursor:pointer}progress{accent-color:#297163;width:84px;height:6px;vertical-align:middle}@media(max-width:600px){label{margin-left:0}nav{gap:6px}button{padding:7px 9px}}
</style></head><body><main>
<div class="label">Extended Euclidean algorithm</div><h1>Finding gcd(168, 133)</h1><p>Carry the weights of <b class="a">a = 168</b> and <b class="b">b = 133</b> forward with each remainder.</p>
<section class="card"><h2>Results so far</h2><table><thead><tr><th>Euclidean division</th><th>Linear combination</th></tr></thead><tbody id="ledger"></tbody></table></section>
<section class="card panel"><div class="header"><strong class="label" id="phase"></strong><span><progress id="progress"></progress> <small id="counter"></small></span></div><div class="formula" id="formula"></div><div class="sub" aria-live="polite"><strong id="title"></strong><p id="subtitle"></p></div>
<nav aria-label="Playback"><button id="restart">↺ Restart</button><button id="prev">← Back</button><button id="play">▶ Play</button><button id="next">Next →</button><label>Speed <select id="speed"><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option></select> ×</label></nav></section>
<details open><summary>Working so far</summary><ol class="work" id="history"></ol></details></main><script>
'use strict';
const $ = id => document.getElementById(id);
const rows = [
 ['Starting values','168','1a + 0b'],['','133','0a + 1b'],
 ['168 = 1 × 133 + 35','35','a − b'],
 ['133 = 3 × 35 + 28','28','−3a + 4b'],
 ['35 = 1 × 28 + 7','7','4a − 5b'],
 ['28 = 4 × 7 + 0','0']
];
// Each motion pairs a source (ledger row or previous token) with a destination token.
const steps=[];
function add(row,title,subtitle,expression,moves=[],save=false){
 steps.push({row,title,subtitle,tokens:expression.split('|'),moves,save});
}
add(1,'Start with the two inputs','The weights of a and b start at (1, 0) for 168 and (0, 1) for 133.','168 =|1a + 0b|,|133 =|0a + 1b');
add(2,'Divide','133 fits once into 168, leaving 35.','168|=|1 × 133|+|35');
add(2,'Isolate the remainder','Subtract 1 × 133 from 168 and write the remainder 35 on the left.','35|=|168|−|1 × 133');
add(2,'Substitute the starting values','Replace 168 by a and 133 by b. The weights of 35 are (1, −1).','35 =|a|−|b',[['r0',1,'a'],['r1',3,'b']],true);
add(3,'Divide','Use 133 and 35 for the next division. The remainder is 28.','133|=|3 × 35|+|28');
add(3,'Isolate the remainder','Subtract 3 × 35 from 133 and write the remainder 28 on the left.','28|=|133|−|3 × 35');
add(3,'Substitute for 35','Bring down the saved expression a − b for 35. The factor −3 multiplies the whole bracket.','28 =|b|− 3| (a − b)',[['r1',1,'b'],['r2',3,'a − b']]);
add(3,'Expand the bracket','Multiplying by −3 gives −3a and +3b. Keep the original b.','28 =|b|− 3a|+ 3b',[[3,2,'−3a'],[3,3,'+3b']]);
add(3,'Combine like terms','The two b terms give b + 3b = 4b. The weights of 28 are (−3, 4).','28 =|−3a|+ 4b',[[2,1],[1,2],[3,2]],true);
add(4,'Divide','Divide 35 by 28. One copy fits, leaving 7.','35|=|1 × 28|+|7');
add(4,'Isolate the remainder','Subtract 1 × 28 from 35 and write the remainder 7 on the left.','7|=|35|−|1 × 28');
add(4,'Substitute both saved results','Replace 35 by a − b and 28 by −3a + 4b. Subtract the entire second bracket.','7 =|(a − b)|−|(−3a + 4b)',[['r2',1,'a − b'],['r3',3,'−3a + 4b']]);
add(4,'Distribute the minus sign','The subtraction changes −3a into +3a and +4b into −4b.','7 =|a|− b|+ 3a|− 4b',[[1,1,'a'],[1,2,'−b'],[3,3,'+3a'],[3,4,'−4b']]);
add(4,'Combine like terms','Collect a + 3a = 4a and −b − 4b = −5b. The weights of 7 are (4, −5).','7 =|4a|− 5b',[[1,1],[3,1],[2,2],[4,2]],true);
add(5,'Test for exact division','7 divides 28 exactly. The previous remainder, 7, is the gcd.',rows[5][0]);
add(5,'Check the answer','The last nonzero remainder is 7, so the gcd is 7. Substituting 168 for a and 133 for b gives 4 × 168 − 5 × 133 = 672 − 665 = 7.','7 =|4 × 168|− 5 × 133',[['r4',1,'4a'],['r4',2,'−5b']]);
let current=0,playing=false,timer;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function tone(text){
 if(text.includes('a')&&!text.includes('b'))return ' a';
 if(text.includes('b')&&!text.includes('a'))return ' b';
 return '';
}
function fly(source,target,label,delay){
 const ghost=document.createElement('span');ghost.className='floating-term';ghost.textContent=label;
 document.body.append(ghost);
 ghost.style.left=source.left+'px';ghost.style.top=source.top+'px';
 const end=target.getBoundingClientRect();
 const dx=end.x+end.width/2-source.x-ghost.offsetWidth/2,dy=end.y-source.y;
 const duration=1550/Number($('speed').value);
 const animation=ghost.animate([{opacity:1,transform:'translate(0,0)'},{offset:.58,opacity:1,transform:'translate('+dx*.58+'px,'+(dy*.58-16)+'px)'},{opacity:0,transform:'translate('+dx+'px,'+dy+'px)'}],{duration,delay,fill:'both',easing:'ease-in-out'});
 animation.onfinish=()=>ghost.remove();
}
// Animate the actual equation terms from their division positions to their new slots.
function rearrange(old) {
 const terms = [...$('formula').children];
 const duration = 1900 / Number($('speed').value);
 const origins = [4, 1, 0, 3, 2];
 terms.forEach((term, i) => {
  const start = old[origins[i]].rect;
  const end = term.getBoundingClientRect();
  const dx = start.left - end.left, dy = start.top - end.top;
  // The remainder travels above the line, while the dividend passes below it.
  const arc = [-24, 0, 22, 0, 10][i];
  const offset = (x, y) => 'translate(' + x + 'px,' + y + 'px)';
  const frames = [
   { transform: offset(dx, dy) },
   { transform: offset(dx / 2, dy / 2 + arc), offset: 0.5 },
   { transform: offset(0, 0) }
  ];
  if (i === 3) {
   // Fade out the old plus as the new subtraction sign appears.
   const plus = document.createElement('span');
   plus.className = 'term';
   plus.textContent = '+';
   Object.assign(plus.style, { position:'fixed', left:start.left+'px', top:start.top+'px',
    font:getComputedStyle(term).font, pointerEvents:'none' });
   plus.classList.add('old-sign');
   document.body.append(plus);
   plus.animate([{opacity:1},{opacity:0}], {duration:duration*.45,fill:'forwards'})
    .onfinish = () => plus.remove();
   frames[0].opacity = 0; frames[1].opacity = 0; frames[2].opacity = 1;
  }
  term.animate(frames, {duration, easing:'ease-in-out'});
 });
}
function render(index){
 const forward=index===current+1;
 const old=Array.from($('formula').children,el=>({rect:el.getBoundingClientRect(),text:el.textContent}));
 document.querySelectorAll('.floating-term,.old-sign').forEach(el=>el.remove());
 current=index;
 const step=steps[index],visited=steps.slice(0,index+1);
 $('ledger').replaceChildren();
 rows.forEach(([division,value,combination],i)=>{
  if(i>1&&!visited.some(s=>s.row===i&&s.save))return;
  const tr=$('ledger').insertRow();tr.insertCell().textContent=division;
  const cell=tr.insertCell();cell.append(value+' = ');
  const expr=document.createElement('span');expr.id='r'+i;expr.textContent=combination;cell.append(expr);
 });
 $('formula').replaceChildren(...step.tokens.map(token=>{
  const span=document.createElement('span');span.className='term'+tone(token);span.textContent=token;return span;
 }));
 $('phase').textContent=index===0?'Starting weights':index===steps.length-1?'Final result':'Remainder '+rows[step.row][1];
 $('progress').max=steps.length;$('progress').value=index+1;
 $('counter').textContent=(index+1)+' / '+steps.length;
 $('title').textContent=step.title;$('subtitle').textContent=step.subtitle;
 $('history').replaceChildren(...visited.slice(0,-1).map(s=>{const li=document.createElement('li');li.textContent=s.tokens.join(' ');return li;}));
 $('prev').disabled=index===0;$('next').disabled=index===steps.length-1;
 if(index===steps.length-1)playing=false;
 $('play').textContent=playing?'Ⅱ Pause':index===steps.length-1?'↺ Replay':'▶ Play';
 if(forward && !reduced.matches && step.title==='Isolate the remainder')rearrange(old);
 step.moves.forEach(([from,to,label],i)=>{
  const ref=typeof from==='string'?$(from):null;
  if(ref)ref.classList.add('source');
  if(!forward||reduced.matches)return;
  const src=ref?ref.getBoundingClientRect():old[from].rect;
  fly(src,$('formula').children[to],label||old[from].text,i*90/Number($('speed').value));
 });
}
function go(index){clearTimeout(timer);playing=false;render(Math.max(0,Math.min(index,steps.length-1)));}
function schedule(){clearTimeout(timer);if(playing)timer=setTimeout(()=>{render(current+1);schedule();},6000/Number($('speed').value));}
function play(){if(current===steps.length-1)go(0);playing=!playing;$('play').textContent=playing?'Ⅱ Pause':'▶ Play';schedule();}
$('prev').onclick=()=>go(current-1);$('next').onclick=()=>go(current+1);$('play').onclick=play;$('restart').onclick=()=>go(0);$('speed').onchange=schedule;
document.addEventListener('keydown',event=>{
 if(event.target.tagName==='SELECT')return;
 if(event.key==='ArrowRight'){event.preventDefault();go(current+1);}
 if(event.key==='ArrowLeft'){event.preventDefault();go(current-1);}
 if(event.code==='Space'&&!['BUTTON','SUMMARY'].includes(event.target.tagName)){event.preventDefault();play();}
});
render(0);
</script></body></html>
